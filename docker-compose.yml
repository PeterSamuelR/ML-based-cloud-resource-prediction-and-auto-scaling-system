services:
  application:
    build:
      context: ./app
    image: cloud-resource-autoscaling-app:phase3
    labels:
      com.ml-autoscaler.project: cloud-resource-autoscaling
      com.ml-autoscaler.role: application
      com.ml-autoscaler.managed: "true"
    expose:
      - "8000"
    networks:
      - application-network

  nginx:
    build:
      context: ./nginx
    image: cloud-resource-autoscaling-nginx:phase3
    ports:
      - "8080:80"
    volumes:
      - nginx-runtime:/etc/nginx/generated
      - nginx-logs:/var/log/nginx
    networks:
      - application-network

  membership-controller:
    build:
      context: ./nginx/membership-controller
    environment:
      APPLICATION_NETWORK: cloud-resource-autoscaling-network
      NGINX_CONTAINER_LABEL: com.docker.compose.service=nginx
      SYNC_INTERVAL_SECONDS: "2"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - nginx-runtime:/runtime

  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_DATABASE: cloud_autoscaling
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - mongodb-data:/data/db

  backend:
    build:
      context: ./backend
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: cloud_autoscaling
      MONITORING_INTERVAL_SECONDS: "5"
      NGINX_ACCESS_LOG: /var/log/nginx/access.json
      CONFIG_DIRECTORY: /config
      APPLICATION_NETWORK: cloud-resource-autoscaling-network
      APPLICATION_IMAGE: cloud-resource-autoscaling-app:phase3
      AUTOSCALING_POLICY: ${AUTOSCALING_POLICY:-reactive}
    ports:
      - "8001:8001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - nginx-logs:/var/log/nginx:ro
      - ./config:/config:ro
      - models-data:/models
    depends_on:
      mongodb:
        condition: service_healthy

networks:
  application-network:
    name: cloud-resource-autoscaling-network

volumes:
  nginx-runtime:
  nginx-logs:
  mongodb-data:
  models-data:
