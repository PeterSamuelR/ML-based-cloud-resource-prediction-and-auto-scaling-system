worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # This file starts as a safe 503 fallback. The membership controller replaces
    # it only after discovering healthy, labelled application containers.
    include /etc/nginx/generated/membership.conf;
}
