project:
  name: cloud-resource-autoscaling
  container_labels:
    project: cloud-resource-autoscaling
    role: application
    managed: "true"

monitoring:
  interval_seconds: 5
  aggregate_cpu_definition: mean_active_healthy_application_replicas

prediction:
  horizon_seconds: 30
  model: random_forest_regression
  temporal_split: chronological
  minimum_training_samples: 120
  recent_training_samples: 120
  training_history_limit: 100000
  refresh_interval_seconds: 300
  max_feedback_lateness_seconds: 15
  training_fraction: 0.8
  random_forest_estimators: 100
  random_seed: 42
  random_forest_tuning:
    n_estimators: [100, 200]
    max_depth: [null, 12]
    min_samples_leaf: [1, 3]
    cv_splits: 3

nginx:
  membership_sync_interval_seconds: 2
  membership_lifecycle: discover_generate_validate_graceful_reload

scaling:
  min_replicas: 1
  max_replicas: 5
  cooldown_seconds: 30
  scale_out_step: 1
  scale_in_step: 1

adaptive:
  absolute_error_threshold: 15.0
  consecutive_error_requirement: 3
  minimum_recent_training_samples: 120
  retraining_cooldown_seconds: 1800
  candidate_validation_required: true

experiment:
  fairness_fields:
    - application_image_and_behavior
    - workload_pattern_and_locust_configuration
    - monitoring_interval
    - replica_limits
    - docker_environment
    - nginx_membership_behavior
    - initial_conditions
    - trial_duration
    - metrics_collection_process
